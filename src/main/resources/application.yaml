spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-post-created-v1
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: latest
      max-poll-records: 1
    listener:
      ack-mode: record
      concurrency: ${NOTIFICATIONS_KAFKA_CONCURRENCY:3}
  data:
    redis:
      port: 6379
      host: localhost
      channel:
        follower: follower_channel
        achievement: achievement_channel

  application:
    name: notification-service

  mail:
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

server:
  port: 8083

logging:
  level:
    root: info

vonage:
  api:
    key: whatever
    secret: whatever

project-service:
    host: localhost
    port: 8082
user-service:
    host: localhost
    port: 8080

notifications:
  transport: ${NOTIFICATIONS_TRANSPORT:redis}
  channels:
    post-created: post.created
  kafka:
    topic: post_topic

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        notifications.email.send: true
